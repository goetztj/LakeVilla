\* TLC Model Configuration for LakeVilla Write-Optimized Protocol
\* Variant enforcing strict acyclicity of dependency graphs at all times.
\* This configuration is stricter than the protocol design, which permits transient cycles.

CONSTANTS
    TABLES = {t1, t2}
    TRANSACTIONS = {T1, T2}
    FILES = {f1, f2}
    MAX_VERSION = 3
    MAX_OPERATIONS = 2

SPECIFICATION Spec

\* Safety invariants
INVARIANT TypeOK

\* Strict acyclicity enforced as an invariant throughout execution.
INVARIANT AcyclicDependencies

INVARIANT SingleTableSerializability
INVARIANT NoLostUpdates
INVARIANT NoDirtyReads

INVARIANT UniqueMarkerVersions
INVARIANT MarkerUniqueness

\* MarkerShiftBreaksCycles is included for completeness; cycles are precluded by AcyclicDependencies.
INVARIANT MarkerShiftBreaksCycles

\* State constraints to bound the state space
CONSTRAINT StateConstraint_SublogLength
CONSTRAINT StateConstraint_CrashedTxns
CONSTRAINT StateConstraint_TableVersions
