\* TLC Model Configuration for LakeVilla Write-Optimized Protocol
\* Verifies liveness properties under fairness assumptions; bounded two-table, two-transaction model.

CONSTANTS
    TABLES = {t1, t2}
    TRANSACTIONS = {T1, T2}
    MAX_VERSION = 3
    MAX_OPERATIONS = 3
    FILES = {f1, f2}

\* Spec includes fairness assumptions to prevent trivial stuttering counterexamples.
SPECIFICATION Spec

\* Safety invariants
INVARIANTS
    TypeOK
    TableLevelAtomicity
    UniqueMarkerVersions
    CausalConsistency
    AcyclicDependencies
    SingleTableSerializability

\* Liveness properties
PROPERTIES
    EventualTermination
    EventualRecovery
    EventualDeadlockResolution

\* State constraints to bound the state space
CONSTRAINT StateConstraint_SublogLength
CONSTRAINT StateConstraint_TableVersions
CONSTRAINT StateConstraint_RequireProgress
