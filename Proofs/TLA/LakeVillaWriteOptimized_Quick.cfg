\* TLC Model Configuration for LakeVilla Write-Optimized Protocol
\* Reduced model for rapid verification of core safety properties.

CONSTANTS
    TABLES = {t1}
    TRANSACTIONS = {T1, T2}
    FILES = {f1, f2}
    MAX_VERSION = 2
    MAX_OPERATIONS = 2

SPECIFICATION Spec

\* Safety invariants

INVARIANT TypeOK

INVARIANT SingleTableSerializability
INVARIANT NoLostUpdates
INVARIANT NoDirtyReads

\* AcyclicDependencies and MarkerShiftBreaksCycles are omitted in this configuration;
\* the protocol permits transient dependency cycles resolved via the marker shift mechanism.
\* INVARIANT AcyclicDependencies
\* INVARIANT MarkerShiftBreaksCycles

INVARIANT UniqueMarkerVersions
INVARIANT MarkerUniqueness

\* Liveness properties are omitted for tractability in this configuration.
\* PROPERTY EventualTermination
\* PROPERTY DeadlockFreedom

\* State constraints to bound the state space
CONSTRAINT StateConstraint_SublogLength
CONSTRAINT StateConstraint_CrashedTxns
CONSTRAINT StateConstraint_TableVersions
