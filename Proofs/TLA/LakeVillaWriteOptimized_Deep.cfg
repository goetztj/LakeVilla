\* TLC Model Configuration for LakeVilla Write-Optimized Protocol
\* Exhaustive verification with an enlarged model for comprehensive deadlock detection.

CONSTANTS
    TABLES = {t1, t2}
    TRANSACTIONS = {T1, T2, T3}
    FILES = {f1, f2, f3}
    MAX_VERSION = 5
    MAX_OPERATIONS = 4

SPECIFICATION Spec

\* Serializability invariants
INVARIANT SingleTableSerializability
INVARIANT MultiTableRepeatableReads
INVARIANT NoLostUpdates
INVARIANT NoDirtyReads
INVARIANT CausalConsistency

\* Deadlock prevention invariants
\* AcyclicDependencies is intentionally omitted; the protocol permits transient dependency cycles
\* resolved by the marker shift mechanism (Lemma 1, Section 4.2).
\* INVARIANT AcyclicDependencies
INVARIANT MarkerShiftBreaksCycles
INVARIANT MarkerUniqueness

\* Atomicity invariants
INVARIANT TableLevelAtomicity
INVARIANT UniqueMarkerVersions

\* Recovery invariants
INVARIANT RecoveryInvariant

\* Liveness properties
PROPERTY EventualTermination
PROPERTY EventualDeadlockResolution
PROPERTY DeadlockFreedom
PROPERTY ConflictResolution
PROPERTY EventualRecovery

\* Combined properties
INVARIANT Safety
PROPERTY Liveness

\* State constraints to bound the state space
CONSTRAINT StateConstraint_SublogLength
CONSTRAINT StateConstraint_CrashedTxns
CONSTRAINT StateConstraint_TableVersions
